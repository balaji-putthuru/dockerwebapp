version: "3.9"

services:
  devopsdb:
    image: balajiputhuru/automation:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  application:
    image: balajiputhuru/automation:app
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
